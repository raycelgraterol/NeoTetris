
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Tetris AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050505;
      color: #ffffff;
      margin: 0;
      overflow: hidden;
    }
    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }
    /* Custom glow effects */
    .neon-border {
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.5), inset 0 0 5px rgba(0, 255, 255, 0.2);
      border: 1px solid rgba(0, 255, 255, 0.5);
    }
    .neon-text-cyan { text-shadow: 0 0 8px rgba(34, 211, 238, 0.8); }
    .neon-text-purple { text-shadow: 0 0 8px rgba(168, 85, 247, 0.8); }
    .neon-bg-cyan { box-shadow: 0 0 15px rgba(34, 211, 238, 0.6); }

    /* Tetris Block Colors */
    .block-I { background: #00f0f0; box-shadow: inset 0 0 10px rgba(255,255,255,0.5), 0 0 15px #00f0f0; }
    .block-J { background: #0000f0; box-shadow: inset 0 0 10px rgba(255,255,255,0.5), 0 0 15px #0000f0; }
    .block-L { background: #f0a000; box-shadow: inset 0 0 10px rgba(255,255,255,0.5), 0 0 15px #f0a000; }
    .block-O { background: #f0f000; box-shadow: inset 0 0 10px rgba(255,255,255,0.5), 0 0 15px #f0f000; }
    .block-S { background: #00f000; box-shadow: inset 0 0 10px rgba(255,255,255,0.5), 0 0 15px #00f000; }
    .block-T { background: #a000f0; box-shadow: inset 0 0 10px rgba(255,255,255,0.5), 0 0 15px #a000f0; }
    .block-Z { background: #f00000; box-shadow: inset 0 0 10px rgba(255,255,255,0.5), 0 0 15px #f00000; }
    .block-ghost { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); }
  </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
