<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Tetris AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050505;
      color: #ffffff;
      margin: 0;
      overflow: hidden;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }

    /* Custom glow effects */
    .neon-border {
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.5), inset 0 0 5px rgba(0, 255, 255, 0.2);
      border: 1px solid rgba(0, 255, 255, 0.5);
    }

    .neon-text-cyan {
      text-shadow: 0 0 8px rgba(34, 211, 238, 0.8);
    }

    .neon-text-purple {
      text-shadow: 0 0 8px rgba(168, 85, 247, 0.8);
    }

    .neon-bg-cyan {
      box-shadow: 0 0 15px rgba(34, 211, 238, 0.6);
    }

    :root {
      --color-I: #00f0f0;
      --color-J: #0000f0;
      --color-L: #f0a000;
      --color-O: #f0f000;
      --color-S: #00f000;
      --color-T: #a000f0;
      --color-Z: #f00000;
    }

    /* Tetris Block Colors */
    .block-I {
      background: var(--color-I);
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3), 0 0 15px var(--color-I);
    }

    .block-J {
      background: var(--color-J);
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3), 0 0 15px var(--color-J);
    }

    .block-L {
      background: var(--color-L);
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3), 0 0 15px var(--color-L);
    }

    .block-O {
      background: var(--color-O);
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3), 0 0 15px var(--color-O);
    }

    .block-S {
      background: var(--color-S);
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3), 0 0 15px var(--color-S);
    }

    .block-T {
      background: var(--color-T);
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3), 0 0 15px var(--color-T);
    }

    .block-Z {
      background: var(--color-Z);
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3), 0 0 15px var(--color-Z);
    }

    .block-ghost {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    @keyframes spin-slow {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .animate-spin-slow {
      animation: spin-slow 8s linear infinite;
    }

    /* Planet Symbols */
    .block-I,
    .block-J,
    .block-L,
    .block-O,
    .block-S,
    .block-T,
    .block-Z {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: bold;
    }

    .theme-planets .block-I:after {
      content: '☿';
    }

    /* Mercurio */
    .theme-planets .block-J:after {
      content: '♀';
    }

    /* Venus */
    .theme-planets .block-L:after {
      content: '⊕';
    }

    /* Tierra */
    .theme-planets .block-O:after {
      content: '♂';
    }

    /* Marte */
    .theme-planets .block-S:after {
      content: '♃';
    }

    /* Júpiter */
    .theme-planets .block-T:after {
      content: '♄';
    }

    /* Saturno */
    .theme-planets .block-Z:after {
      content: '⛢';
    }

    /* Urano */
  </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
